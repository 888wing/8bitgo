<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第七席原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
/* 佈局：上半部是正在說話的人，下半部是你的桌面；評議室裡，黑板取代證人台。筆記本、證物、記錄和須知收在底部的抽屜。 */
:root {
  --desk: #e3e6dd;        /* 法院公文紙的灰綠 */
  --paper: #f5f6f0;       /* 筆記本 */
  --ink: #1d2733;         /* 藍黑墨水 */
  --ink-soft: #5d6873;
  --rule: #cfd5ca;
  --trust: #24466f;       /* 「信」的印泥 */
  --doubt: #7a4d14;       /* 「疑」的印泥 */
  --red: #b3261e;         /* 不予採納 */
  --board: #23352d;       /* 黑板 */
  --frame: #5b4630;       /* 黑板木框 */
  --chalk: #e9eee6;
  --chalk-dim: #8fa398;
  --chalk-amber: #e3c46d;
  --scrim: rgb(20 26 24 / 0.55);
  --focus: #2f6db5;
  --font-print: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
  --font-hand: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "Noto Serif TC", serif;
  --font-ui: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121715; --paper: #1b211e; --ink: #dfe6dd; --ink-soft: #95a29a; --rule: #2d3832;
    --trust: #92b4e6; --doubt: #e3b66b; --red: #e5594d; --board: #172720; --frame: #3f3122;
    --chalk: #e3e9e0; --chalk-dim: #7e9086; --chalk-amber: #e5c470; --scrim: rgb(0 0 0 / 0.6); --focus: #92b4e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121715; --paper: #1b211e; --ink: #dfe6dd; --ink-soft: #95a29a; --rule: #2d3832;
  --trust: #92b4e6; --doubt: #e3b66b; --red: #e5594d; --board: #172720; --frame: #3f3122;
  --chalk: #e3e9e0; --chalk-dim: #7e9086; --chalk-amber: #e5c470; --scrim: rgb(0 0 0 / 0.6); --focus: #92b4e6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk);
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { max-width: 40rem; margin: 0 auto; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: baseline; gap: 12px;
  padding-block: 12px 10px;
  background: var(--desk);
  border-bottom: 1px solid var(--rule);
}
.place { font-family: var(--font-print); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.04em; }
.time { color: var(--ink-soft); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.topbar .settings { margin-left: auto; background: none; border: 0; color: var(--ink-soft); font-size: 0.85rem; padding: 4px 0; cursor: pointer; }

.stage { display: flex; flex-direction: column; gap: 14px; padding-block: 16px; }

/* 傳票（標題） */
.summons {
  background: var(--paper); border: 1px solid var(--rule); padding: 28px 22px; margin-top: 8vh;
  display: flex; flex-direction: column; gap: 14px;
}
.summons .eyebrow { color: var(--red); }
.summons h1 { font-family: var(--font-print); font-size: 2.6rem; line-height: 1.1; margin: 0; letter-spacing: 0.12em; }
.summons .lede { font-family: var(--font-print); font-size: 1.1rem; margin: 0; text-wrap: balance; }
.summons .small { color: var(--ink-soft); font-size: 0.85rem; margin: 0; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.18em; color: var(--ink-soft); }

.stand { display: flex; gap: 10px; align-items: baseline; min-height: 1.4em; font-size: 0.9rem; }
.stand:empty { display: none; }

/* 對白 */
.speech { background: var(--paper); border: 1px solid var(--rule); padding: 14px 16px 16px; min-height: 8.5rem; }
.history { list-style: none; margin: 0 0 10px; padding: 0; color: var(--ink-soft); font-size: 0.85rem; display: grid; gap: 2px; }
.history li { font-family: var(--font-print); }
.current .who { font-size: 0.8rem; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 2px; }
.current .line { margin: 0; font-family: var(--font-print); font-size: 1.15rem; line-height: 1.7; }
.current.narration .line { color: var(--ink-soft); }
.current.thought .line { font-family: var(--font-hand); }
.current.thought .line::before { content: "（"; } .current.thought .line::after { content: "）"; }
.current.paper-line .line { font-weight: 700; letter-spacing: 0.02em; }
.jot { margin: -4px 0 0; min-height: 1.4em; font-family: var(--font-hand); color: var(--trust); font-size: 0.95rem; }
.jot:empty { display: none; }

.continue, .primary, .secondary, .action, .option, .ballot-option, .stamp-choice, .stamp-button {
  cursor: pointer; border-radius: 2px;
}
#panel, .continue { scroll-margin-top: 72px; scroll-margin-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
#panel:empty { display: none; }
.continue { align-self: flex-end; background: var(--ink); color: var(--paper); border: 0; padding: 10px 22px; font-size: 1rem; letter-spacing: 0.1em; }
.primary { background: var(--ink); color: var(--paper); border: 0; padding: 10px 18px; font-size: 1rem; }
.secondary { background: none; border: 1px solid var(--ink-soft); padding: 8px 14px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--trust); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 0.9rem; }

/* 印章 */
.stamp {
  --rot: -4deg;
  display: inline-grid; place-items: center; min-width: 2.1em; height: 2.1em; padding: 0 0.15em;
  border: 2px solid currentColor; border-radius: 3px; font-family: var(--font-print); font-weight: 700; line-height: 1;
  transform: rotate(var(--rot)); opacity: 0.92;
}
.stamp.trust { color: var(--trust); }
.stamp.doubt { color: var(--doubt); }
.stamp.struck { color: var(--red); font-size: 0.8rem; padding: 0 0.4em; }
.stamp.empty { color: var(--rule); border-style: dashed; }
.stamp.old { opacity: 0.45; position: relative; }
.stamp.old::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; border-top: 2px solid var(--ink); transform: rotate(-12deg); }
.stamp.pressed { animation: press 0.32s ease-out; }
@keyframes press { 0% { transform: scale(1.7) rotate(var(--rot)); opacity: 0; } 70% { opacity: 1; } 100% { transform: scale(1) rotate(var(--rot)); } }

/* 印章盤 */
.tray { background: var(--paper); border: 1px solid var(--rule); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.tray-title { margin: 0; font-size: 0.85rem; color: var(--ink-soft); letter-spacing: 0.06em; }
.tray-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 10px; }
.tray-claim { margin: 0; font-family: var(--font-hand); font-size: 1.05rem; min-width: 0; }
.tray-buttons { display: flex; gap: 8px; flex: none; }
.stamp-choice {
  width: 3rem; height: 3rem; background: none; border: 2px dashed var(--rule); font-family: var(--font-print); font-weight: 700; font-size: 1.2rem; color: var(--ink-soft);
}
.stamp-choice.on.trust { border: 2px solid var(--trust); color: var(--trust); }
.stamp-choice.on.doubt { border: 2px solid var(--doubt); color: var(--doubt); }
.stamp-choice.on { transform: rotate(-4deg); }
.stamp-choice.pressed { animation: press 0.32s ease-out; }
.stamp-button.red { align-self: flex-start; background: none; border: 2px solid var(--red); color: var(--red); font-family: var(--font-print); font-weight: 700; padding: 10px 16px; font-size: 1rem; }
.struck-line { margin: 0; font-family: var(--font-hand); font-size: 1.05rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* 黑板 */
.board-wrap { background: var(--frame); padding: 6px; }
.board {
  background: var(--board); color: var(--chalk); padding: 10px 8px 12px;
  display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, minmax(1.45rem, 1.8rem)); gap: 2px; align-items: center;
  font-family: var(--font-hand);
}
.board .cell { text-align: center; }
.board .corner { text-align: left; color: var(--chalk-dim); font-size: 0.75rem; letter-spacing: 0.1em; }
.board .seat { color: var(--chalk-dim); font-size: 0.85rem; }
.board .seat.you { color: var(--chalk); text-decoration: underline; text-underline-offset: 4px; }
.board .label { text-align: left; font-size: 0.78rem; line-height: 1.25; color: var(--chalk); min-width: 0; padding-right: 4px; }
.board .mark { font-size: 1rem; line-height: 1.5; }
.board .mark.trust { color: var(--chalk); }
.board .mark.doubt { color: var(--chalk-amber); }
.board .mark.blank, .board .mark.hidden { color: var(--chalk-dim); }
.board .mark.struck { color: var(--chalk-dim); }
.board .mark.you { background: rgb(255 255 255 / 0.06); }
.board .mark.peek { opacity: 0.45; font-size: 0.8rem; }
.board .belief { font-size: 0.75rem; color: var(--chalk-amber); }
.board .mark.changed { animation: chalk 0.7s ease-out; }
@keyframes chalk { 0% { opacity: 0; transform: scale(1.5); } 60% { opacity: 1; } 100% { transform: scale(1); } }

/* 評議室動作 */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action { text-align: left; background: var(--paper); border: 1px solid var(--rule); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.action:disabled { opacity: 0.45; cursor: default; }
.action-label { font-family: var(--font-print); font-weight: 700; font-size: 1rem; }
.action-hint { font-size: 0.78rem; color: var(--ink-soft); line-height: 1.4; }

/* 投票 */
.ballot { background: var(--paper); border: 1px solid var(--rule); padding: 14px 16px; display: grid; gap: 12px; }
.ballot-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ballot-option { background: none; border: 1px solid var(--ink-soft); padding: 16px 4px; font-family: var(--font-hand); font-size: 1.35rem; }
.hint { margin: 0; color: var(--ink-soft); font-size: 0.85rem; }
.reading { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.slip { font-family: var(--font-hand); font-size: 1.15rem; padding: 6px 10px; border: 1px solid var(--rule); background: var(--desk); animation: chalk 0.5s ease-out; }
.slip.G { color: var(--red); } .slip.NG { color: var(--trust); } .slip.U { color: var(--ink-soft); }
.tally { margin: 0; font-family: var(--font-hand); font-size: 1.05rem; font-variant-numeric: tabular-nums; }

/* 抽屜 */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--desk); border-top: 1px solid var(--rule);
}
.tab { background: var(--paper); border: 1px solid var(--rule); padding: 9px 4px; font-size: 0.95rem; cursor: pointer; position: relative; }
.tab[aria-expanded="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab.new::after { content: ""; position: absolute; top: 6px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  max-height: min(68vh, 34rem); overflow-y: auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-top: 2px solid var(--ink);
  box-shadow: 0 -12px 28px rgb(0 0 0 / 0.18);
}
.sheet-inner { max-width: 40rem; margin: 0 auto; }
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--paper); display: flex; align-items: center; padding-block: 12px 8px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-family: var(--font-print); font-size: 1.1rem; }
.sheet-head button { margin-left: auto; background: none; border: 0; color: var(--ink-soft); cursor: pointer; padding: 4px 0; }
.sheet-body { display: grid; gap: 18px; padding-top: 12px; }
.page h3, .exhibit h3 { margin: 0 0 8px; font-family: var(--font-print); font-size: 1rem; display: flex; gap: 8px; align-items: baseline; }
.code { font-family: var(--font-ui); font-size: 0.75rem; color: var(--red); border: 1px solid currentColor; padding: 0 4px; }
.claim {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding-block: 10px;
  border-top: 1px solid var(--rule);
}
.claim-stamps { display: flex; gap: 4px; align-items: flex-start; padding-top: 2px; }
.claim-text { margin: 0; font-family: var(--font-hand); font-size: 1.05rem; }
.claim.is-struck .claim-text { text-decoration: line-through; color: var(--ink-soft); }
.claim-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.claim-tools .stamp-choice { width: 2.4rem; height: 2.4rem; font-size: 1rem; }
.hand { font-family: var(--font-hand); }
.note { margin: 4px 0 0; color: var(--trust); }
.empty { color: var(--ink-soft); margin: 0; }
.exhibit { display: grid; gap: 6px; }
.exhibit > p { margin: 0; }
.detail { border-left: 2px solid var(--rule); padding-left: 10px; }
.detail p { margin: 0; }
.transcript { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--font-print); font-size: 0.92rem; }
.transcript .day { font-family: var(--font-ui); font-size: 0.75rem; letter-spacing: 0.12em; color: var(--ink-soft); margin-top: 8px; }
.transcript .who { color: var(--ink-soft); }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-family: var(--font-print); }

/* 選擇框 */
.modal { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--paper); width: min(100%, 32rem); max-height: 82vh; overflow-y: auto; padding: 16px; display: grid; gap: 10px; border-top: 3px solid var(--ink); }
.modal-head { display: flex; gap: 12px; align-items: baseline; }
.modal-head h2 { margin: 0; font-family: var(--font-print); font-size: 1.05rem; text-wrap: balance; }
.modal-head button { margin-left: auto; background: none; border: 0; color: var(--ink-soft); cursor: pointer; }
.option { text-align: left; background: none; border: 1px solid var(--rule); padding: 10px 12px; display: grid; gap: 2px; }
.option:hover { border-color: var(--ink-soft); }
.option-title { font-family: var(--font-print); font-weight: 700; }
.option-note { font-size: 0.85rem; color: var(--ink-soft); }
.option-note.hand { font-family: var(--font-hand); color: var(--trust); font-size: 0.95rem; }
.big { font-size: 1.15rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding-block: 6px; border-bottom: 1px solid var(--rule); }

/* 結局 */
.debrief { background: var(--paper); border: 1px solid var(--rule); padding: 18px 16px; display: grid; gap: 16px; }
.debrief h2 { margin: 0; font-family: var(--font-print); font-size: 1.6rem; letter-spacing: 0.08em; }
.debrief h3 { margin: 0 0 6px; font-size: 0.8rem; letter-spacing: 0.14em; color: var(--ink-soft); font-weight: 600; }
.debrief section p, .debrief ol, .debrief ul { margin: 0; }
.debrief ol, .debrief ul { padding-left: 1.3em; display: grid; gap: 4px; }
.debrief .warn { color: var(--red); margin-top: 6px; }
.unheard li { text-decoration: line-through; text-decoration-color: var(--red); }

@media (prefers-reduced-motion: reduce) {
  .stamp.pressed, .stamp-choice.pressed, .board .mark.changed, .slip { animation: none; }
}
</style>
</head>
<body>
<div class="app" lang="zh-Hant-HK">
  <header class="topbar">
    <span class="place" id="place">第七席</span>
    <span class="time" id="time"></span>
    <button class="settings" id="settings" type="button">設定</button>
  </header>
  <main class="stage" id="stage"></main>
</div>
<nav class="tabs" id="tabs" aria-label="你的桌面" hidden>
  <button class="tab" id="tab-notebook" data-tab="notebook" type="button" aria-expanded="false">筆記本</button>
  <button class="tab" id="tab-exhibits" data-tab="exhibits" type="button" aria-expanded="false">證物</button>
  <button class="tab" id="tab-transcript" data-tab="transcript" type="button" aria-expanded="false">記錄</button>
  <button class="tab" id="tab-rules" data-tab="rules" type="button" aria-expanded="false">須知</button>
</nav>
<section class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" type="button">合上</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</section>
<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
