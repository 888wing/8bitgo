<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第七席證物樣板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1110; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="frame" aria-label="證物樣板：每件證物的原大和放大鏡下的樣子"></canvas>
<script type="module">
import { SHEET_TEXT, SHEET_W, SHEET_H, drawSheet } from './sheet.js';

await Promise.allSettled(['400 12px "Noto Sans TC"', '500 12px "Noto Sans TC"', '700 12px "Noto Sans TC"', '700 12px "LXGW WenKai TC"'].map((f) => document.fonts.load(f, SHEET_TEXT)));
const canvas = drawSheet(document.getElementById('frame'));
const fit = () => {
  const dpr = window.devicePixelRatio || 1;
  const k = Math.max(1, Math.floor(Math.min((innerWidth - 32) * dpr / SHEET_W, (innerHeight - 32) * dpr / SHEET_H)));
  canvas.style.width = `${(SHEET_W * k) / dpr}px`;
  canvas.style.height = `${(SHEET_H * k) / dpr}px`;
};
fit();
addEventListener('resize', fit);
window.__frameReady = true;
</script>
</body>
</html>
